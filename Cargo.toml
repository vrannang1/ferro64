[package]
name = "ferro64"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.13"
actix-files = "0.6"
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
# rustls: no system OpenSSL needed on Linux or Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
base64 = "0.22"
ring = "0.17"
tera = { version = "1", default-features = false }
tokio-stream = "0.1"
futures-util = "0.3"
scraper = "0.22"
url = "2.5.8"
actix-ws = "0.4"
portable-pty = "0.9"
calamine = { version = "0.38.0", features = ["chrono"] }
csv = "1.4.0"
regex = "1.13.1"
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-haskell = "0.24.1"
tree-sitter-swift = "0.7.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-c-sharp = "0.23.5"

[workspace]
members = ["desktop"]
